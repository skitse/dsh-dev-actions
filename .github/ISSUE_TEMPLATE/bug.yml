name: Bug report
description: 报告快捷动作创建、展示、执行或反馈的问题。
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开会话...
        2. 模型创建动作...
        3. 点击...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本
      description: DSH、dsh-dev-actions 和 dsh-better-sidebar 版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先移除密钥、Token、用户名和本机绝对路径。
